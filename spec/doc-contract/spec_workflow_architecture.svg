<svg viewBox="0 0 720 580" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .t { fill: #171717; font: 400 14px/20px "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .th { fill: #171717; font: 500 14px/20px "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .ts { fill: #52525B; font: 400 12px/18px "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .tt { fill: #171717; font: 600 16px/24px "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .arr { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arr-brand { stroke: #4B3FE3; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      g.c-neutral > rect, rect.c-neutral { fill: #F7F7F8; stroke: rgba(23,23,23,0.12); }
      g.c-brand > rect, rect.c-brand { fill: #F2F7FF; stroke: #4B3FE3; }
      .c-brand > .th, .c-brand > .t { fill: #1A1759; }
      .c-brand > .ts { fill: #4B3FE3; }
      g.c-accent > rect, rect.c-accent { fill: #EAFBF8; stroke: #27D2BF; }
      .c-accent > .th, .c-accent > .t { fill: #0F766E; }
      .c-accent > .ts { fill: #27D2BF; }
    </style>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
    <marker id="arr-brand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" class="tt">Spec 驱动开发工作流</text>
  <text x="360" y="48" text-anchor="middle" class="ts">10 步 × 5 阶段 · 反幻觉 · 文档驱动 · 审查闭环</text>

  <!-- Phase boxes -->
  <g class="c-brand">
    <rect x="12" y="64" width="124" height="74" rx="8"/>
    <text x="74" y="88" text-anchor="middle" class="th">Phase 1</text>
    <text x="74" y="106" text-anchor="middle" class="th">调研</text>
    <text x="74" y="124" text-anchor="middle" class="ts">Step 1-2</text>
  </g>
  <g class="c-neutral">
    <rect x="156" y="64" width="124" height="74" rx="8"/>
    <text x="218" y="88" text-anchor="middle" class="th">Phase 2</text>
    <text x="218" y="106" text-anchor="middle" class="th">设计</text>
    <text x="218" y="124" text-anchor="middle" class="ts">Step 3-4</text>
  </g>
  <g class="c-neutral">
    <rect x="300" y="64" width="124" height="74" rx="8"/>
    <text x="362" y="88" text-anchor="middle" class="th">Phase 3</text>
    <text x="362" y="106" text-anchor="middle" class="th">实施</text>
    <text x="362" y="124" text-anchor="middle" class="ts">Step 5-6</text>
  </g>
  <g class="c-neutral">
    <rect x="444" y="64" width="124" height="74" rx="8"/>
    <text x="506" y="88" text-anchor="middle" class="th">Phase 4</text>
    <text x="506" y="106" text-anchor="middle" class="th">验收</text>
    <text x="506" y="124" text-anchor="middle" class="ts">Step 7-8</text>
  </g>
  <g class="c-accent">
    <rect x="588" y="64" width="120" height="74" rx="8"/>
    <text x="648" y="88" text-anchor="middle" class="th">Phase 5</text>
    <text x="648" y="106" text-anchor="middle" class="th">实现</text>
    <text x="648" y="124" text-anchor="middle" class="ts">Step 9-10</text>
  </g>

  <path d="M136 101 L153 101" class="arr-brand" marker-end="url(#arr-brand)"/>
  <path d="M280 101 L297 101" class="arr" marker-end="url(#arr)"/>
  <path d="M424 101 L441 101" class="arr" marker-end="url(#arr)"/>
  <path d="M568 101 L585 101" class="arr" marker-end="url(#arr)"/>

  <!-- Step details -->
  <g class="c-neutral"><rect x="12" y="146" width="124" height="34" rx="6"/><text x="74" y="168" text-anchor="middle" class="ts">Step 1: MCP 工具调研</text></g>
  <g class="c-brand"><rect x="12" y="186" width="124" height="34" rx="6"/><text x="74" y="208" text-anchor="middle" class="ts">Step 2: Review 幻觉排除</text></g>
  <g class="c-neutral"><rect x="156" y="146" width="124" height="34" rx="6"/><text x="218" y="168" text-anchor="middle" class="ts">Step 3: 架构/模块/接口</text></g>
  <g class="c-brand"><rect x="156" y="186" width="124" height="34" rx="6"/><text x="218" y="208" text-anchor="middle" class="ts">Step 4: Review 设计对齐</text></g>
  <g class="c-neutral"><rect x="300" y="146" width="124" height="34" rx="6"/><text x="362" y="168" text-anchor="middle" class="ts">Step 5: 工程细节/接口</text></g>
  <g class="c-brand"><rect x="300" y="186" width="124" height="34" rx="6"/><text x="362" y="208" text-anchor="middle" class="ts">Step 6: Review 依赖/签名</text></g>
  <g class="c-neutral"><rect x="444" y="146" width="124" height="34" rx="6"/><text x="506" y="168" text-anchor="middle" class="ts">Step 7: 编写验收 Checklist</text></g>
  <g class="c-brand"><rect x="444" y="186" width="124" height="34" rx="6"/><text x="506" y="208" text-anchor="middle" class="ts">Step 8: Review 文档一致性</text></g>
  <g class="c-neutral"><rect x="588" y="146" width="120" height="34" rx="6"/><text x="648" y="168" text-anchor="middle" class="ts">Step 9: TDD 实现</text></g>
  <g class="c-accent"><rect x="588" y="186" width="120" height="34" rx="6"/><text x="648" y="208" text-anchor="middle" class="ts">Step 10: ADD 审计验收</text></g>

  <path d="M74 180 L74 183" class="arr-brand" marker-end="url(#arr-brand)"/>
  <path d="M218 180 L218 183" class="arr-brand" marker-end="url(#arr-brand)"/>
  <path d="M362 180 L362 183" class="arr-brand" marker-end="url(#arr-brand)"/>
  <path d="M506 180 L506 183" class="arr-brand" marker-end="url(#arr-brand)"/>
  <path d="M648 180 L648 183" class="arr" marker-end="url(#arr)"/>

  <!-- Document pipeline -->
  <rect x="12" y="240" width="696" height="20" rx="6" fill="#EFEFF2"/>
  <text x="360" y="254" text-anchor="middle" class="ts">文档产出管道</text>

  <g class="c-neutral"><rect x="28" y="268" width="148" height="44" rx="8"/><text x="102" y="288" text-anchor="middle" class="th">RESEARCH.md</text><text x="102" y="304" text-anchor="middle" class="ts">Step 2 产出</text></g>
  <g class="c-neutral"><rect x="196" y="268" width="148" height="44" rx="8"/><text x="270" y="288" text-anchor="middle" class="th">DESIGN.md</text><text x="270" y="304" text-anchor="middle" class="ts">Step 3 产出</text></g>
  <g class="c-neutral"><rect x="364" y="268" width="148" height="44" rx="8"/><text x="438" y="288" text-anchor="middle" class="th">IMPLEMENTATION.md</text><text x="438" y="304" text-anchor="middle" class="ts">Step 5 产出</text></g>
  <g class="c-brand"><rect x="532" y="268" width="148" height="44" rx="8"/><text x="606" y="288" text-anchor="middle" class="th">CHECKLIST.md</text><text x="606" y="304" text-anchor="middle" class="ts">Step 7 产出</text></g>

  <path d="M176 290 L193 290" class="arr" marker-end="url(#arr)"/>
  <path d="M344 290 L361 290" class="arr" marker-end="url(#arr)"/>
  <path d="M512 290 L529 290" class="arr" marker-end="url(#arr)"/>

  <!-- Review gates -->
  <rect x="12" y="328" width="696" height="20" rx="6" fill="#EFEFF2"/>
  <text x="360" y="342" text-anchor="middle" class="ts">Review 门禁（Step 2/4/6/8 Review）</text>

  <g class="c-neutral"><rect x="28" y="356" width="148" height="36" rx="8"/><text x="102" y="378" text-anchor="middle" class="ts">文献/置信度/推测</text></g>
  <g class="c-neutral"><rect x="196" y="356" width="148" height="36" rx="8"/><text x="270" y="378" text-anchor="middle" class="ts">假设/替代方案/边界</text></g>
  <g class="c-neutral"><rect x="364" y="356" width="148" height="36" rx="8"/><text x="438" y="378" text-anchor="middle" class="ts">stdlib/版本/签名</text></g>
  <g class="c-brand"><rect x="532" y="356" width="148" height="36" rx="8"/><text x="606" y="378" text-anchor="middle" class="ts">四文档两两对齐</text></g>

  <!-- Rules -->
  <rect x="12" y="408" width="696" height="20" rx="6" fill="#EFEFF2"/>
  <text x="360" y="422" text-anchor="middle" class="ts">六条 Review 规则（RULE-1~6）</text>

  <g class="c-neutral"><rect x="12" y="434" width="112" height="32" rx="6"/><text x="68" y="454" text-anchor="middle" class="ts">RULE-1 时序独立</text></g>
  <g class="c-neutral"><rect x="130" y="434" width="112" height="32" rx="6"/><text x="186" y="454" text-anchor="middle" class="ts">RULE-2 统计溯源</text></g>
  <g class="c-neutral"><rect x="248" y="434" width="112" height="32" rx="6"/><text x="304" y="454" text-anchor="middle" class="ts">RULE-3 隔离四要素</text></g>
  <g class="c-neutral"><rect x="366" y="434" width="112" height="32" rx="6"/><text x="422" y="454" text-anchor="middle" class="ts">RULE-4 自查声明</text></g>
  <g class="c-neutral"><rect x="484" y="434" width="112" height="32" rx="6"/><text x="540" y="454" text-anchor="middle" class="ts">RULE-5 异构审查</text></g>
  <g class="c-brand"><rect x="602" y="434" width="106" height="32" rx="6"/><text x="655" y="454" text-anchor="middle" class="ts">RULE-6 证据绑定</text></g>

  <!-- Bottom -->
  <rect x="12" y="482" width="340" height="44" rx="8" fill="#EFEFF2" stroke="rgba(23,23,23,0.12)"/>
  <text x="182" y="502" text-anchor="middle" class="th">ADD 审计</text>
  <text x="182" y="518" text-anchor="middle" class="ts">Iron Law · 四阶段 · 取证矩阵 E1-E5</text>

  <rect x="368" y="482" width="340" height="44" rx="8" fill="#EFEFF2" stroke="rgba(23,23,23,0.12)"/>
  <text x="538" y="502" text-anchor="middle" class="th">DC1-DC4 文档契约</text>
  <text x="538" y="518" text-anchor="middle" class="ts">front-matter / 状态词表 / 引用四档 / 命名空间</text>

  <path d="M352 504 L365 504" class="arr" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="12" y="540" width="8" height="8" rx="2" fill="#F2F7FF" stroke="#4B3FE3"/>
  <text x="26" y="548" class="ts">Review 步</text>
  <rect x="88" y="540" width="8" height="8" rx="2" fill="#EAFBF8" stroke="#27D2BF"/>
  <text x="102" y="548" class="ts">验收/交付</text>
  <rect x="174" y="540" width="8" height="8" rx="2" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text x="188" y="548" class="ts">普通流程</text>
  <line x1="264" y1="544" x2="288" y2="544" class="arr-brand" marker-end="url(#arr-brand)"/>
  <text x="296" y="548" class="ts">主线路径</text>
  <line x1="364" y1="544" x2="388" y2="544" class="arr" marker-end="url(#arr)"/>
  <text x="396" y="548" class="ts">数据流</text>
</svg>