<svg viewBox="0 0 1200 560" width="1200" height="560" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="560" fill="#F0EEE6"/>

  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="4" fill="#55544F">SELF-VERIFICATION</text>
  <text x="60" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#141413">方法论自实证</text>
  <rect x="60" y="106" width="36" height="3" fill="#D97757"/>
  <text x="60" y="140" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#3D3D3A">这套工作流自身也被当作实验对象测量 —— 每轮审查追加样本至 M7 证据账本（唯一活载体）。</text>

  <!-- Three big numbers -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <rect x="60" y="170" width="340" height="220" rx="8" fill="#FFFFFF" stroke="#DBD8CC"/>
    <text x="84" y="268" font-size="88" fill="#141413">6</text>
    <text x="84" y="304" font-size="16" fill="#141413">轮审查样本</text>
    <text x="84" y="330" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#55544F">同基座自查 / 异构双盲 / 探针 pilot</text>
    <text x="84" y="350" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#55544F">独立审计 / S1 异基座复验</text>

    <rect x="430" y="170" width="340" height="220" rx="8" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
    <text x="454" y="268" font-size="88" fill="#D97757">11</text>
    <text x="454" y="304" font-size="16" fill="#141413">处形态 II 复发</text>
    <text x="454" y="330" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#55544F">弱记忆填充：版本号 / 章节号 / 行号 / 计数</text>
    <text x="454" y="350" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#55544F">「看起来精确、凭印象可填」的字段</text>

    <rect x="800" y="170" width="340" height="220" rx="8" fill="#FFFFFF" stroke="#DBD8CC"/>
    <text x="824" y="268" font-size="88" fill="#141413">4</text>
    <text x="824" y="304" font-size="16" fill="#141413">条复发规律</text>
    <text x="824" y="330" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#55544F">最新：审计修正自身含计数错误</text>
    <text x="824" y="350" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#55544F">—— 由异基座复验独立重跑发现</text>
  </g>

  <!-- Conclusion band -->
  <rect x="60" y="420" width="1080" height="90" rx="8" fill="#FDF4EF" stroke="#D97757" stroke-width="1"/>
  <text x="600" y="458" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#141413">形态 II 无法被「要求给链接」拦截，但可被 E1 机械枚举拦截。</text>
  <text x="600" y="486" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#B4552F">正确拦截层是脚本重跑，不是 LLM 自查。</text>
</svg>
