<svg viewBox="0 0 1200 900" width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#F0EEE6"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#55544F"/>
    </marker>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#D97757"/>
    </marker>
  </defs>

  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="4" fill="#55544F">THE WORKFLOW</text>
  <text x="60" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#141413">10 步 × 5 阶段</text>
  <rect x="60" y="106" width="36" height="3" fill="#D97757"/>

  <!-- Phase headers -->
  <g font-family="-apple-system, 'Segoe UI', sans-serif">
    <g>
      <rect x="60" y="134" width="204" height="56" rx="6" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
      <text x="162" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#141413">Phase 1 · 调研</text>
      <text x="162" y="176" text-anchor="middle" font-size="12" fill="#55544F">Step 1–2</text>
    </g>
    <g>
      <rect x="288" y="134" width="204" height="56" rx="6" fill="#FFFFFF" stroke="#DBD8CC"/>
      <text x="390" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#141413">Phase 2 · 设计</text>
      <text x="390" y="176" text-anchor="middle" font-size="12" fill="#55544F">Step 3–4</text>
    </g>
    <g>
      <rect x="516" y="134" width="204" height="56" rx="6" fill="#FFFFFF" stroke="#DBD8CC"/>
      <text x="618" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#141413">Phase 3 · 实施</text>
      <text x="618" y="176" text-anchor="middle" font-size="12" fill="#55544F">Step 5–6</text>
    </g>
    <g>
      <rect x="744" y="134" width="204" height="56" rx="6" fill="#FFFFFF" stroke="#DBD8CC"/>
      <text x="846" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#141413">Phase 4 · 验收</text>
      <text x="846" y="176" text-anchor="middle" font-size="12" fill="#55544F">Step 7–8</text>
    </g>
    <g>
      <rect x="972" y="134" width="168" height="56" rx="6" fill="#FFFFFF" stroke="#DBD8CC"/>
      <text x="1056" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#141413">Phase 5 · 实现</text>
      <text x="1056" y="176" text-anchor="middle" font-size="12" fill="#55544F">Step 9–10</text>
    </g>
  </g>

  <!-- Step cards: odd (produce) + even (review gate) -->
  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12">
    <g>
      <rect x="60" y="204" width="204" height="34" rx="5" fill="#FAF9F5" stroke="#DBD8CC"/>
      <text x="162" y="226" text-anchor="middle" fill="#3D3D3A">Step 1 · MCP 多工具调研</text>
      <rect x="60" y="244" width="204" height="34" rx="5" fill="#FDF4EF" stroke="#D97757"/>
      <text x="162" y="266" text-anchor="middle" fill="#B4552F">Step 2 · Review 幻觉排除 ⌾</text>
    </g>
    <g>
      <rect x="288" y="204" width="204" height="34" rx="5" fill="#FAF9F5" stroke="#DBD8CC"/>
      <text x="390" y="226" text-anchor="middle" fill="#3D3D3A">Step 3 · 架构 / 模块 / 接口</text>
      <rect x="288" y="244" width="204" height="34" rx="5" fill="#FDF4EF" stroke="#D97757"/>
      <text x="390" y="266" text-anchor="middle" fill="#B4552F">Step 4 · Review 设计对齐 ⌾</text>
    </g>
    <g>
      <rect x="516" y="204" width="204" height="34" rx="5" fill="#FAF9F5" stroke="#DBD8CC"/>
      <text x="618" y="226" text-anchor="middle" fill="#3D3D3A">Step 5 · 工程细节 / 签名</text>
      <rect x="516" y="244" width="204" height="34" rx="5" fill="#FDF4EF" stroke="#D97757"/>
      <text x="618" y="266" text-anchor="middle" fill="#B4552F">Step 6 · Review 依赖 / stdlib ⌾</text>
    </g>
    <g>
      <rect x="744" y="204" width="204" height="34" rx="5" fill="#FAF9F5" stroke="#DBD8CC"/>
      <text x="846" y="226" text-anchor="middle" fill="#3D3D3A">Step 7 · 验收 Checklist</text>
      <rect x="744" y="244" width="204" height="34" rx="5" fill="#FDF4EF" stroke="#D97757"/>
      <text x="846" y="266" text-anchor="middle" fill="#B4552F">Step 8 · Review 四文档对齐 ⌾</text>
    </g>
    <g>
      <rect x="972" y="204" width="168" height="34" rx="5" fill="#FAF9F5" stroke="#DBD8CC"/>
      <text x="1056" y="226" text-anchor="middle" fill="#3D3D3A">Step 9 · TDD 实现</text>
      <rect x="972" y="244" width="168" height="34" rx="5" fill="#FDF4EF" stroke="#D97757"/>
      <text x="1056" y="266" text-anchor="middle" fill="#B4552F">Step 10 · ADD 审计 ⌾</text>
    </g>
  </g>

  <text x="1140" y="300" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#B4552F">⌾ = Review 门禁：完稿后的独立 pass 才能勾选</text>

  <!-- Document pipeline -->
  <text x="60" y="336" font-family="Georgia, serif" font-size="14" letter-spacing="3" fill="#55544F">DOCUMENT PIPELINE</text>
  <g font-family="-apple-system, 'Segoe UI', sans-serif">
    <g>
      <rect x="60" y="352" width="246" height="58" rx="6" fill="#FFFFFF" stroke="#DBD8CC"/>
      <text x="183" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#141413">RESEARCH.md</text>
      <text x="183" y="395" text-anchor="middle" font-size="11" fill="#55544F">Step 2 产出 · A/B/C 断言分级</text>
    </g>
    <g>
      <rect x="336" y="352" width="246" height="58" rx="6" fill="#FFFFFF" stroke="#DBD8CC"/>
      <text x="459" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#141413">DESIGN.md</text>
      <text x="459" y="395" text-anchor="middle" font-size="11" fill="#55544F">Step 3 产出 · 职责边界 / 不变式</text>
    </g>
    <g>
      <rect x="612" y="352" width="246" height="58" rx="6" fill="#FFFFFF" stroke="#DBD8CC"/>
      <text x="735" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#141413">IMPLEMENTATION.md</text>
      <text x="735" y="395" text-anchor="middle" font-size="11" fill="#55544F">Step 5 产出 · 版本 / 签名验证</text>
    </g>
    <g>
      <rect x="888" y="352" width="252" height="58" rx="6" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
      <text x="1014" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#141413">CHECKLIST.md</text>
      <text x="1014" y="395" text-anchor="middle" font-size="11" fill="#55544F">Step 7 产出 · ADD 审计入口</text>
    </g>
    <path d="M306 381 L330 381" stroke="#55544F" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
    <path d="M582 381 L606 381" stroke="#55544F" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
    <path d="M858 381 L882 381" stroke="#55544F" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  </g>

  <!-- Feedback loop -->
  <path d="M1014 410 L1014 436 L183 436 L183 412" stroke="#D97757" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
  <text x="598" y="431" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#B4552F">审计发现 P1/P2 → 回到实现；P1 清零 → feature 完成</text>

  <!-- Rules -->
  <text x="60" y="478" font-family="Georgia, serif" font-size="14" letter-spacing="3" fill="#55544F">SIX REVIEW RULES</text>
  <g font-family="-apple-system, 'Segoe UI', sans-serif">
    <g>
      <rect x="60" y="494" width="176" height="60" rx="6" fill="#FFFFFF" stroke="#DBD8CC"/>
      <text x="74" y="518" font-family="Georgia, serif" font-size="13" fill="#D97757">RULE-1</text>
      <text x="74" y="538" font-size="13" fill="#141413">时序独立</text>
    </g>
    <g>
      <rect x="248" y="494" width="176" height="60" rx="6" fill="#FFFFFF" stroke="#DBD8CC"/>
      <text x="262" y="518" font-family="Georgia, serif" font-size="13" fill="#D97757">RULE-2</text>
      <text x="262" y="538" font-size="13" fill="#141413">统计溯源</text>
    </g>
    <g>
      <rect x="436" y="494" width="176" height="60" rx="6" fill="#FFFFFF" stroke="#DBD8CC"/>
      <text x="450" y="518" font-family="Georgia, serif" font-size="13" fill="#D97757">RULE-3</text>
      <text x="450" y="538" font-size="13" fill="#141413">隔离四要素</text>
    </g>
    <g>
      <rect x="624" y="494" width="176" height="60" rx="6" fill="#FFFFFF" stroke="#DBD8CC"/>
      <text x="638" y="518" font-family="Georgia, serif" font-size="13" fill="#D97757">RULE-4</text>
      <text x="638" y="538" font-size="13" fill="#141413">单视角声明</text>
    </g>
    <g>
      <rect x="812" y="494" width="176" height="60" rx="6" fill="#FFFFFF" stroke="#DBD8CC"/>
      <text x="826" y="518" font-family="Georgia, serif" font-size="13" fill="#D97757">RULE-5</text>
      <text x="826" y="538" font-size="13" fill="#141413">异构审查</text>
    </g>
    <g>
      <rect x="1000" y="494" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
      <text x="1014" y="518" font-family="Georgia, serif" font-size="13" fill="#D97757">RULE-6</text>
      <text x="1014" y="538" font-size="13" fill="#141413">证据绑定</text>
    </g>
  </g>

  <!-- Bottom: ADD + DC -->
  <g font-family="-apple-system, 'Segoe UI', sans-serif">
    <rect x="60" y="588" width="528" height="96" rx="8" fill="#FFFFFF" stroke="#DBD8CC"/>
    <text x="84" y="622" font-family="Georgia, serif" font-size="18" fill="#141413">ADD 审计</text>
    <text x="84" y="646" font-size="13" fill="#3D3D3A">Iron Law：测试通过 ≠ 设计落地</text>
    <text x="84" y="666" font-size="12" fill="#55544F">四阶段：质量门 → 完整性 → 忠实度 → 语义 · 取证矩阵 E1–E5</text>

    <rect x="612" y="588" width="528" height="96" rx="8" fill="#FFFFFF" stroke="#DBD8CC"/>
    <text x="636" y="622" font-family="Georgia, serif" font-size="18" fill="#141413">DC1–DC4 文档契约</text>
    <text x="636" y="646" font-size="13" fill="#3D3D3A">每份文档自带可机读的元数据与登记</text>
    <text x="636" y="666" font-size="12" fill="#55544F">front-matter 七字段 / 状态词表 / 引用四档 / 命名空间登记</text>
  </g>

  <!-- Legend -->
  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#55544F">
    <rect x="60" y="716" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#DBD8CC"/>
    <text x="82" y="727">产出步</text>
    <rect x="150" y="716" width="14" height="14" rx="3" fill="#FDF4EF" stroke="#D97757"/>
    <text x="172" y="727">Review 门禁步</text>
    <line x1="280" y1="723" x2="312" y2="723" stroke="#D97757" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="320" y="727">审计反馈回路</text>
    <line x1="428" y1="723" x2="460" y2="723" stroke="#55544F" stroke-width="1.5"/>
    <text x="468" y="727">文档依赖</text>
  </g>
  <text x="60" y="770" font-family="Georgia, serif" font-size="13" fill="#55544F" font-style="italic">Step 2 门禁语义：FALSIFIED 已改写 · CONFLICT/STEP_GAP 已仲裁 · 阻断性断言双源满足 —— 满足前禁止进入 Step 3。</text>
</svg>
