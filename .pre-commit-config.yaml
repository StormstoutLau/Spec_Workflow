# DC 契约校验器（DC1-DC5 + R7）——repo-local hook
# 设计：spec/precommit-dc-validator/DESIGN.md §3.1（repo: local + language: system）
# 安装：pre-commit install
# 手动：pre-commit run dc-validator --all-files
# 说明：entry 走 python 前缀（Windows 无 /bin/sh，RESEARCH §2.1 陷阱实证）
repos:
  - repo: local
    hooks:
      - id: dc-validator
        name: DC contract validator (DC1-DC5 + R7)
        entry: python scripts/dc_validator.py
        language: system
        # 作用域收窄：排除 .arc（ARC 图存储，P-035 与 dc_validator 目录遍历排除同义）。
        # 缺陷修复（2026-09-26）：原 `\.md$` 会把 tools/arc/data/.arc/decisions/*.md 喂给校验器，
        # 而校验器的 .arc 排除仅在 os.walk 生效 → 显式传文件名时失效，报 P1/P2 误判。
        files: ^(?!.*\.arc/).*\.md$
      # M7 账本统计校验器（P-011，R7 同构：hits 声明 = 机械重数）
      # 设计：spec/m7-hits-block/M7_HITS_DESIGN.md §3.1（files 收窄至 M7 路径）
      - id: m7-stats
        name: M7 ledger hits block validator
        entry: python scripts/m7_stats.py
        language: system
        files: ^docs/M7_EVIDENCE_LOG\.md$
      # 视图层机械枚举校验器（P-014，DIS-010 处置：声明 = 机械重数外推到视图层）
      # 设计：spec/repo-stats/REPO_STATS_DESIGN.md §3.4（对账作用域 = 视图载体集 ∪ 真值源集）
      - id: repo-stats
        name: View-layer enumeration validator (stats block)
        entry: python scripts/repo_stats.py
        language: system
        files: ^(CODE_WIKI\.md|README(\.en)?\.md|\.pre-commit-config\.yaml|docs/|spec/|adr/|scripts/)
      # 批次级流程强制校验器（P-024，ADR-0011 出路 A——应走管线批次提交门禁：session 存在 + 决策流非空）
      # 设计：spec/step-gate-enforcement/DESIGN.md §4.2（files 收窄至四文档 + 遗留前缀命名；只读零副作用 P-022 教训）
      # P-027（2026-09-09）：files 正则扩展 [A-Z0-9_]+_ 前缀——P-003 命名约定前遗留的非标准命名文档纳入扫描
      - id: step-enforce
        name: Step decision-stream enforcement (P-024, ADR-0011 A)
        entry: python scripts/step_enforce.py
        language: system
        # P-130（U-1 O3 Phase 1）：触发面扩到 session 与 PROGRESS——批次声明、变更 session、
        # 维护模式都需要在提交时被同一解析器看到（spec/framework-deep-review/DESIGN.md §3.4）。
        files: ^(spec/[a-z0-9-]+/(?:[A-Z0-9_]+_)?(?:RESEARCH|DESIGN|IMPLEMENTATION|CHECKLIST(?:_FUNC)?)\.md|tools/spec_runner/sessions/.*\.jsonl|docs/PROGRESS\.md)$
      # 项目控制台生成器（P-043，L0 门禁触发：提交即刷新；前身 = P-041 任务看板 board-gen）
      # 设计：spec/project-console/DESIGN.md §3.1/§3.3（生成 + git add → 提交即刷新；唯一写路径 docs/CONSOLE.md，纯派生）
      # pass_filenames=false：作用域由 files 正则收窄（源 = PROGRESS + 事件流 + spec 四文档）
      - id: console-gen
        name: Project console generator (derived view, P-043)
        entry: python scripts/console_gen.py --stage
        language: system
        pass_filenames: false
        files: ^(docs/PROGRESS\.md|tools/spec_runner/sessions/.*\.jsonl|spec/.*(?:RESEARCH|DESIGN|IMPLEMENTATION|CHECKLIST)\.md)$
      # 外置黑盒回归（P-111，用户裁决 C：第 6 道门禁；覆盖原 B1「不加 hook」）
      # 设计：tests/test_hook_blackbox.py（stdlib unittest；temp 镜像仓；15 用例）
      # P-139（P1-1 / U-3）：触发面补 `tools/spec_runner/spec_runner.py`——此前单独改 runner
      # 不触发任何本地 hook（repo-stats 只覆盖 scripts/ 等，console-gen 只覆盖 sessions/四文档），
      # 属实测门禁缺口；同日新增 test_runner_integration / test_runner_mutation（真实 runner + 临时仓）。
      # pass_filenames=false：unittest discover 不接收文件名；files 收窄到被测脚本与测试自身
      - id: blackbox-tests
        name: External blackbox regression (tests/, P-111)
        entry: python -m unittest discover -s tests -v
        language: system
        pass_filenames: false
        files: ^(tests/.*\.py|scripts/(step_enforce|spec_map)\.py|tools/spec_runner/spec_runner\.py)$
