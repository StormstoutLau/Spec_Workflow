# L2 CI 门禁（远程兜底强制）——P-070 · spec/ci-gate/DESIGN.md §3
#
# 定位：本地 pre-commit 六 hook 是 L1（诚实护栏，git 官方明示可用 `--no-verify` 绕过，
# hook-surface §3.2 实证 12 种绕过向量全放行）。本 workflow 把同一批判据搬到远端复验：
# **本地能拦的，CI 也拦** —— 绕过本地 hook 不再等于放行。
#
# 边界（诚实声明）：
#   - 只在**本仓**触发；不对消费仓（Cpp_Hub 等）产生任何强制（跨仓 L3 属 P-039 P-c，未实现）。
#   - 只读复验：不写任何文件、不需要网络、零第三方依赖（与三校验器同栈 stdlib）。
#   - 强制力仍是「提交/合并门」而非运行时阻塞；远端 required check 须在 GitHub 侧
#     开启 branch protection 后才生效（本仓侧只提供 job）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # check context 名固定为 ASCII `verify`（避免 CJK 进入 required status check 的 context / API JSON）
    name: verify
    runs-on: windows-latest      # 与开发环境同平台（Windows），避免平台漂移造成假红
    env:
      # P-070 首跑实证（run 37106315633）：CI 日志管道下 stdout 默认 cp1252 ⇒
      # 校验器打印中文即 UnicodeEncodeError，在打印违规之前 exit 1（非违规，纯环境面）。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      # 2026-10-04（P-070 追加轮 ⑨）：checkout v4 → v5 / setup-python v5 → v6
      # 消除 Node 20 deprecation 告警（v4/v5 目标 Node 20，被强制跑在 Node 24）
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # P-130：merge-base 变更集需要完整历史
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # 与开发环境一致（P-070 实测本机 = 3.11.16）

      # ── 与本地六 hook 等价的复验（顺序 = 门禁链顺序；黑盒测试见下方独立 step）──
      - name: DC 契约 + R7 计数（dc-validator）
        run: python scripts/dc_validator.py --check-all
      - name: M7 账本 hits 块（m7-stats）
        run: python scripts/m7_stats.py
      - name: 视图层枚举（repo-stats）
        run: python scripts/repo_stats.py
      - name: 派生视图与源一致（console-gen --check）
        run: python scripts/console_gen.py --check
      # P-130（U-1 O3 Phase 1）：从「全量四文档」改为变更集；
      # 不使用第三方 changed-files action（CVE-2025-30066），路径过滤由 git 自身完成。
      # P-134（U-10 F）：fail-closed 化——移除 fail-open 短路容错，git diff 失败显式 exit 1；
      # `set -eo pipefail` 为自文档化冗余（shell: bash 官方默认已含 -eo pipefail）；
      # 根提交/孤儿分支回退 BASE 取不到父提交（显式绿灯，不崩溃）；force-push 非祖先 base ⇒ 红（有意 fail-closed）。
      # P-140（P-127 假红 + digest 跨批冲突）：**逐提交遍历**替代 `BASE...HEAD` 单次 diff。
      # 本地门禁语义 = 「每个提交各自声明自己那一批」；单次 diff 把整条分支的所有批次塞进一个
      # 变更集（实测 PR #58：declared = P-125..P-139 共 15 条 ⇒ P-127 无链接行被重复点名），
      # 且 P-137/P-138 的 digest 绑定各自批次字节、与 PR 头必然不等 ⇒ 结构性假红。
      # 同判定面（I-11）= **该提交的内容 × 该提交所在时点的门禁版本**：拿 HEAD 版门禁复验历史
      # 内容属于「追溯施加当时不存在的新规则」（实测：P-127 提交在 P-130 新增的「声明须有
      # feature 链接」规则下变红 = 另一类结构性假红），故执行器取提交自身版本。
      - name: 决策流批次强制（step-enforce，逐提交）
        shell: bash
        run: |
          set -eo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse --verify --quiet HEAD^ || true)"
            [ -n "$BASE" ] || BASE="$(git rev-parse HEAD)"
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          trap 'git checkout -q -f "$HEAD_SHA"' EXIT
          if ! COMMITS=$(git rev-list --reverse "$BASE..HEAD"); then
            echo "step-enforce: git rev-list failed for base $BASE (fail-closed)" >&2
            exit 1
          fi
          if [ -z "$COMMITS" ]; then
            echo "step-enforce: no commits in range $BASE..HEAD"
            exit 0
          fi
          # P-144（U-11）：合并提交的 evil 内容检测（阶段 1，先于逐提交判定）。
          # 合并提交在下方循环被跳过（变更 = 父提交并集）；冲突解决时手写进来、两父皆无的
          # 内容会因此**永久逃逸**（P-144 实测 A-49：同一内容走普通提交判红 exit 1，走合并
          # 解决则循环 exit 0）。本段只判「同时不等于两父」的受判路径 ⇒ 干净合并不判，
          # 不引入 P-140 那类并集假红。执行器取 CI 自身 checkout（新规则前向生效）。
          for C in $COMMITS; do
            if [ "$(git rev-list --parents -n 1 "$C" | wc -w)" -gt 2 ]; then
              python scripts/step_enforce.py --check-merge "$C"
            fi
          done

          n=0
          for C in $COMMITS; do
            # 合并提交的变更 = 其父提交的并集（逐父已被本循环覆盖）；对它求 diff 会把整条分支
            # 塞回单一变更集 ⇒ 结构性假红。显式跳过（evil 内容已由上方阶段 1 检测兜底）。
            if [ "$(git rev-list --parents -n 1 "$C" | wc -w)" -gt 2 ]; then
              echo "step-enforce: skip merge commit $C（变更 = 父提交并集）"
              continue
            fi
            PARENT="$(git rev-parse --verify --quiet "$C^" || true)"
            if [ -z "$PARENT" ]; then
              echo "step-enforce: root commit $C（无父提交，显式跳过）"
              continue
            fi
            git checkout -q -f "$C"
            if ! FILES=$(git diff --name-only "$PARENT" "$C" -- 'spec/**' 'tools/spec_runner/sessions/**' 'docs/PROGRESS.md'); then
              echo "step-enforce: git diff failed for $C (fail-closed)" >&2
              exit 1
            fi
            if [ -z "$FILES" ]; then
              continue
            fi
            n=$((n + 1))
            echo "step-enforce: commit $C"
            # 执行器 = 该提交自身版本（P-130 前的版本无 `--base`，按其原调用约定运行）
            if grep -q 'add_argument("--base"' scripts/step_enforce.py; then
              python scripts/step_enforce.py --base "$PARENT" $FILES
            else
              python scripts/step_enforce.py $FILES
            fi
          done
          echo "step-enforce: 逐提交遍历完成，受判提交 $n 个（range $BASE..$HEAD_SHA）"

      # ── 内嵌自测（齐平 + 自测档：把回归面也纳入远端）────────────────────
      - name: 内嵌自测（六件）
        shell: bash
        run: |
          python scripts/dc_validator.py --selftest
          python scripts/m7_stats.py --selftest
          python scripts/repo_stats.py --selftest
          python scripts/console_gen.py --selftest
          python tools/spec_runner/spec_runner.py selftest
          python scripts/rework_graph_check.py --selftest

      # ── P-111 外置黑盒回归（step_enforce 包装层 + spec_map 契约；stdlib unittest）──
      # 定位：只补内嵌 selftest 未覆盖的 CLI 包装层。本地已接第 6 道 hook `blackbox-tests`
      # （用户指令覆盖初裁 B1）；本 step = 远端兜底，绕过本地 hook 时仍拦截。
      - name: 外置黑盒回归（tests/，P-111）
        run: python -m unittest discover -s tests -v